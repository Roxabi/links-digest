# Build & publish ghcr.io/roxabi/intel-scrape on changes to service or web-intel.
name: scrape-image

on:
  push:
    branches: [staging, main]
    paths:
      - "services/scrape/**"
      - "plugins/web-intel/**"
      - ".github/workflows/scrape-image.yml"
  pull_request:
    branches: [staging, main]
    paths:
      - "services/scrape/**"
      - "plugins/web-intel/**"
      - ".github/workflows/scrape-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/roxabi/intel-scrape

jobs:
  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Install + test service
        working-directory: services/scrape
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv run pytest -q

  image:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/staging' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build (and push on push/dispatch)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/scrape/Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
