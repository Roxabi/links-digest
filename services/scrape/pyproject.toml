[project]
name = "intel-scrape"
version = "0.1.0"
description = "HTTP scrape service — web-intel engine for factory and consumers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.0",
    "httpx>=0.27",
    "trafilatura>=1.8",
    "playwright>=1.40",
    "playwright-stealth>=2.0.2",
    "requests>=2.31",
    "filelock>=3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
intel-scrape = "intel_scrape.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["intel_scrape"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
